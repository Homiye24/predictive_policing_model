[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zone17-predictive-policing"
version = "0.1.0"
description = "Research implementation of an explainable spatial-temporal crime forecasting model for Police Zone 17."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "openpyxl>=3.1", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
nlp = ["scikit-learn>=1.3", "nltk>=3.8", "gensim>=4.3"]
deep-learning = ["torch>=2.1", "torch-geometric>=2.4"]
explainability = ["shap>=0.44"]
visualization = ["matplotlib>=3.8", "seaborn>=0.13"]

[project.scripts]
predictive-policing = "predictive_policing.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/predictive_policing"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
